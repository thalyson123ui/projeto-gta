<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Theft Auto VI - Seleção de Personagem</title>
    <!-- Fonte no estilo oficial da Rockstar / GTA -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,800;0,900;1,900&family=Teko:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <!-- Logo e marca d'água no estilo Rockstar -->
        <header class="rockstar-header">
            <span class="badge-gta">VI</span>
        </header>

        <!-- Nome do personagem em destaque no fundo com tom Vice City -->
        <p class="nome-destaque">LUCIA</p>

        <!-- Imagem do personagem selecionado -->
        <div class="destaque-personagem">
            <img class="personagem-img" src="img/lucia.png" alt="Personagem Lucia">
        </div>

        <!-- Textos e apresentação no padrão Rockstar Games -->
        <section class="conteudo-texto">
            <span class="etiqueta">VICE CITY // SELEÇÃO</span>
            <h1>NÃO É SÓ <br><span class="texto-gradiente">UM JOGO</span></h1>
            <p class="texto-apoio">Escolha uma lenda de Vice City e domine as ruas do estado de Leonida.</p>
        </section>

        <!-- Menu de seleção no estilo Glassmorphism Neon -->
        <nav class="menu-selecao">
            <button class="btn-avatar ativo" aria-label="Selecionar Lucia">
                <img src="img/lucia.png" alt="Avatar Lucia">
                <span class="nome-btn">LUCIA</span>
            </button>
            <button class="btn-avatar" aria-label="Selecionar Jason">
                <img src="img/jason.png" alt="Avatar Jason">
                <span class="nome-btn">JASON</span>
            </button>
            <button class="btn-avatar" aria-label="Selecionar CJ">
                <img src="img/cj.png" alt="Avatar CJ">
                <span class="nome-btn">CJ</span>
            </button>
        </nav>
    </main>

    <script src="script.js"></script>
</body>
</html>
